name: Fix SVG chess pieces
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace broken SVG loader
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('<script id="svg-chess-symbols">')
          if start < 0:
              raise SystemExit(0)
          end=s.find('</script>', start)
          if end < 0:
              raise SystemExit(1)
          script='''<script id="svg-chess-symbols">(function(){\nvar NS='http://www.w3.org/2000/svg';\nvar paths={p:'M12 3c-2 0-3 1.5-3 3 0 1.1.6 2 1.5 2.6C8.5 10 7 12 7 14h10c0-2-1.5-4-3.5-5.4C14.4 8 15 7.1 15 6c0-1.5-1-3-3-3zm-6 13h12v2H6z',n:'M7 19h10v-2H9c0-3 2-5 6-7l-2-6H8l-2 4 3 2c-3 2-4 5-4 9z',b:'M12 3c-3 2-5 5-5 8 0 2 1 3 3 4H7v2h10v-2h-3c2-1 3-2 3-4 0-3-2-6-5-8zm0 3c1.4 1.7 2.3 3.3 2.3 5H9.7c0-1.7.9-3.3 2.3-5z',r:'M6 3h12v3h-2v7h2v4H6v-4h2V6H6z',q:'M5 5l2 3 5-5 5 5 2-3-2 10H7zM6 17h12v2H6z',k:'M11 2h2v3h3v2h-3v3h4v7H7v-7h4V7H8V5h3zm-2 12v3h6v-3z'};\nfunction icon(type,color,cls){var svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');svg.classList.add(cls||'svg-piece');var path=document.createElementNS(NS,'path');path.setAttribute('d',paths[type]||paths.p);path.setAttribute('fill',color==='w'?'#fff':'#111');path.setAttribute('stroke',color==='w'?'#111':'#fff');path.setAttribute('stroke-width','1.2');svg.appendChild(path);return svg}\nwindow.svgPiece=icon;\nfunction decorateBoard(){document.querySelectorAll('.sq').forEach(function(sq){var old=sq.querySelector('.svg-piece');if(old)return;var t=sq.textContent.trim();var map={'♙':'pw','♘':'nw','♗':'bw','♖':'rw','♕':'qw','♔':'kw','♟':'pb','♞':'nb','♝':'bb','♜':'rb','♛':'qb','♚':'kb'};var key=map[t];if(key){sq.textContent='';sq.appendChild(icon(key[0],key[1],'svg-piece'));}})}\nfunction decorateAnalysis(){document.querySelectorAll('.review-row').forEach(function(row){if(row.querySelector('.analysis-piece'))return;var move=row.querySelector('.review-move');if(!move)return;var san=move.textContent.trim();var m=san.match(/^[KQRBN]/);var t=m?m[0].toLowerCase():'p';move.prepend(icon(t,'w','analysis-piece'));})}\nvar tries=0;function watch(){decorateBoard();decorateAnalysis();if(tries++<40)setTimeout(watch,150)}\ndocument.addEventListener('DOMContentLoaded',watch);setTimeout(watch,50);\n})();</script>'''
          s=s[:start]+script+s[end+9:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: make SVG chess pieces render' || exit 0
          git push
