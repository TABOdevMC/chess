name: Fix SVG chess pieces
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install robust SVG renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('<script id="svg-chess-symbols">')
          if start < 0:
              raise SystemExit(0)
          end=s.find('</script>', start)
          if end < 0:
              raise SystemExit(1)
          script=r'''<script id="svg-chess-symbols">(function(){
          var NS='http://www.w3.org/2000/svg';
          var paths={p:'M12 3c-2 0-3 1.5-3 3 0 1.1.6 2 1.5 2.6C8.5 10 7 12 7 14h10c0-2-1.5-4-3.5-5.4C14.4 8 15 7.1 15 6c0-1.5-1-3-3-3zm-6 13h12v2H6z',n:'M7 19h10v-2H9c0-3 2-5 6-7l-2-6H8l-2 4 3 2c-3 2-4 5-4 9z',b:'M12 3c-3 2-5 5-5 8 0 2 1 3 3 4H7v2h10v-2h-3c2-1 3-2 3-4 0-3-2-6-5-8zm0 3c1.4 1.7 2.3 3.3 2.3 5H9.7c0-1.7.9-3.3 2.3-5z',r:'M6 3h12v3h-2v7h2v4H6v-4h2V6H6z',q:'M5 5l2 3 5-5 5 5 2-3-2 10H7zM6 17h12v2H6z',k:'M11 2h2v3h3v2h-3v3h4v7H7v-7h4V7H8V5h3zm-2 12v3h6v-3z'};
          function icon(type,color,cls){var svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');svg.classList.add(cls||'svg-piece');var path=document.createElementNS(NS,'path');path.setAttribute('d',paths[type]||paths.p);path.setAttribute('fill',color==='w'?'#fff':'#111');path.setAttribute('stroke',color==='w'?'#111':'#fff');path.setAttribute('stroke-width','1.2');path.setAttribute('vector-effect','non-scaling-stroke');svg.appendChild(path);return svg}
          window.svgPiece=icon;
          var map={'♙':['p','w'],'♘':['n','w'],'♗':['b','w'],'♖':['r','w'],'♕':['q','w'],'♔':['k','w'],'♟':['p','b'],'♞':['n','b'],'♝':['b','b'],'♜':['r','b'],'♛':['q','b'],'♚':['k','b']};
          function decorateBoard(){document.querySelectorAll('.sq').forEach(function(sq){if(sq.querySelector('.svg-piece'))return;var walker=document.createTreeWalker(sq,NodeFilter.SHOW_TEXT);var node;while(node=walker.nextNode()){var text=node.nodeValue,hit=null,key=null;for(var ch in map){var at=text.indexOf(ch);if(at>=0&&(hit===null||at<hit)){hit=at;key=ch}}if(key){var d=map[key],before=text.slice(0,hit),after=text.slice(hit+key.length),frag=document.createDocumentFragment();if(before)frag.appendChild(document.createTextNode(before));frag.appendChild(icon(d[0],d[1],'svg-piece'));if(after)frag.appendChild(document.createTextNode(after));node.parentNode.replaceChild(frag,node);break}}})}
          function decorateAnalysis(){document.querySelectorAll('.review-row').forEach(function(row){if(row.querySelector('.analysis-piece'))return;var move=row.querySelector('.review-move');if(!move)return;var text=move.textContent.trim(),m=text.match(/^([KQRBN])/),type=m?m[1].toLowerCase():'p';move.prepend(icon(type,'w','analysis-piece'))})}
          function render(){decorateBoard();decorateAnalysis()}
          document.addEventListener('DOMContentLoaded',render);
          var observer=new MutationObserver(function(){render()});
          function start(){if(document.body)observer.observe(document.body,{childList:true,subtree:true});render()}
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
          })();</script>'''
          s=s[:start]+script+s[end+9:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: reliably render SVG chess pieces' || exit 0
          git push
