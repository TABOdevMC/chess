name: Fix chess.js CDN

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-cdn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix chess.js CDN URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://cdn.jsdelivr.net/npm/chess.js@1.0.0/dist/chess.min.js'
          new = 'https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0/chess.min.js'
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: use working chess.js CDN"
          git push
