name: Vendor Stockfish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Stockfish
        run: |
          curl -L --fail --retry 3 "https://unpkg.com/stockfish.js@10.0.2/stockfish.js" -o stockfish.js
          test -s stockfish.js
          head -c 80 stockfish.js

      - name: Commit engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stockfish.js
          if git diff --cached --quiet -- stockfish.js; then
            echo "Stockfish already up to date"
            exit 0
          fi
          git commit -m "vendor: stockfish"
          git push
