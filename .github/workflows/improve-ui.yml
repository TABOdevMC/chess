name: Improve UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply modern UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* modern-ui-v2 */'
          if marker in s:
              raise SystemExit(0)
          css=r'''<style>/* modern-ui-v2 */
:root{--bg:#080c14;--card:#111827;--line:#293750;--text:#f8fafc;--muted:#94a3b8;--a:#8b5cf6;--a2:#7c3aed;--light:#f0d9b5;--dark:#b58863}
body{background:radial-gradient(900px 500px at 50% -140px,#29375e 0,#111827 45%,#080c14 80%);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:1320px;padding:24px}.top{margin-bottom:24px}.brand{gap:14px}.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#9b6cff,#6d28d9);box-shadow:0 12px 35px #7c3aed55}.brand h1{font-size:23px;letter-spacing:-.6px}
nav{padding:5px;background:#0b1220dd;border:1px solid #26344d;border-radius:15px;box-shadow:0 8px 30px #0004}.tab,.btn{border-radius:12px;padding:10px 14px;font-weight:700;transition:transform .16s,background .16s,box-shadow .16s}.tab:hover,.btn:hover{transform:translateY(-2px);background:#1d2a40}.tab.active,.btn.primary{background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 9px 25px #7c3aed44}
.layout,.analysis{grid-template-columns:minmax(380px,1fr) 360px;gap:22px}.card{background:linear-gradient(145deg,#151f31ee,#0e1625ee);border:1px solid #2a3954;border-radius:21px;padding:19px;box-shadow:0 24px 70px #0007;backdrop-filter:blur(8px)}
.board{width:min(100%,700px);border:4px solid #1b263b;border-radius:15px;box-shadow:0 28px 80px #000b}.sq{font-size:clamp(30px,7vw,66px);transition:filter .12s,transform .12s}.sq:hover{filter:brightness(1.09)}.sq.sel{outline:0;box-shadow:inset 0 0 0 5px #c4b5fd, inset 0 0 35px #8b5cf655}.sq.legal:after{width:18%;background:#111a}.sq.capture:after{border-color:#a78bfaaa}
.status{margin-top:15px;padding:11px 13px;background:#0a1220;border:1px solid #273650;border-radius:13px}.controls{gap:9px}.moves{max-height:410px;scrollbar-width:thin}.move{padding:10px 6px;border-bottom:1px solid #202e45}.move:hover{background:#ffffff05}
h2{font-size:21px;letter-spacing:-.3px}h3{font-size:16px}.form{gap:14px}.form select,textarea{background:#09111e;border-color:#2b3a55;border-radius:12px;padding:12px}.form select:focus,textarea:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px #8b5cf622}
.levelmenu{background:#09111e;border-color:#2b3a55;border-radius:14px}.level-choice{padding:13px 14px}.level-choice:hover{background:#ffffff08}.level-choice.active{background:linear-gradient(90deg,#8b5cf626,#8b5cf60b)}.level-choice .check{color:#c4b5fd}.more-btn{padding:12px;background:#111c2d}.elo-panel{background:#070e19;padding:15px}.elo-range{height:6px}
.result{background:#09111e;border-color:#2b3a55;border-radius:13px;padding:14px}.footer{padding:28px;color:#64748b}
@media(max-width:900px){.app{padding:13px}.top{gap:13px}.top nav{width:100%;overflow-x:auto}.layout,.analysis{grid-template-columns:1fr;gap:14px}.board{width:min(94vw,700px)}.card{border-radius:17px;padding:14px}}
@media(max-width:520px){.brand h1{font-size:19px}.brand small{font-size:12px}.logo{width:44px;height:44px}.tab,.btn{padding:9px 11px;font-size:13px}.status{font-size:13px}.controls .btn{flex:1}}
</style>'''
          s=s.replace('</head>',css+'</head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ui: modern glass chess design"
          git push