name: Fix PGN export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch export
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="pgn-export-fix"' not in s:
              code=r'''<script id="pgn-export-fix">(function(){function pgnExport(g,name,white,black){if(!g||!g.history().length){alert('Aucun coup à exporter.');return}var result='*';if(g.in_checkmate())result=g.turn()==='w'?'0-1':'1-0';else if(g.in_draw()||g.in_stalemate()||g.insufficient_material())result='1/2-1/2';var text='[Event "Partie Chess"]\n[Site "Chess"]\n[White "'+(white||'Blancs')+'"]\n[Black "'+(black||'Noirs')+'"]\n[Result "'+result+'"]\n\n'+g.pgn({max_width:0,newline_char:'\n'});if(!text.trim().endsWith(result))text+=' '+result;var blob=new Blob([text],{type:'application/x-chess-pgn;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}function add(id,game,name,white,black){if(document.getElementById(id))return;var b=document.createElement('button');b.className='btn';b.id=id;b.type='button';b.textContent='⬇ Exporter PGN';b.addEventListener('click',function(){pgnExport(game,name,white,black)});var c=b.parentElement;c.appendChild(b)}function init(){add('botExport','bot','partie-bot.pgn',document.getElementById('botColor')&&document.getElementById('botColor').value==='w'?'Vous':'Stockfish',document.getElementById('botColor')&&document.getElementById('botColor').value==='b'?'Vous':'Stockfish');add('localExport','local','partie-2-joueurs.pgn','Blancs','Noirs');var be=document.getElementById('botExport');if(be)be.onclick=function(){pgnExport(window.bot,'partie-bot.pgn',document.getElementById('botColor').value==='w'?'Vous':'Stockfish',document.getElementById('botColor').value==='b'?'Vous':'Stockfish')};var le=document.getElementById('localExport');if(le)le.onclick=function(){pgnExport(window.local,'partie-2-joueurs.pgn','Blancs','Noirs')}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();</script>'''
              s=s.replace('</body>',code+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: reliable PGN download"
          git push
