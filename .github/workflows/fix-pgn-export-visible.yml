name: Restore visible PGN export
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-pgn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add working PGN export buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="pgn-export-fix"'
          if marker in s:
              raise SystemExit(0)
          inject=r'''<style id="pgn-export-style">.pgn-export{display:inline-flex;align-items:center;gap:7px}.pgn-export svg{width:17px;height:17px}</style><script id="pgn-export-fix">(function(){
          function svg(){return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/><path d="M5 3h8l6 6v11H5z"/></svg>'}
          function add(id,kind){var host=document.getElementById(id);if(!host||host.parentElement.querySelector('[data-pgn-export="'+kind+'"]'))return;var b=document.createElement('button');b.type='button';b.className='btn pgn-export';b.dataset.pgnExport=kind;b.innerHTML=svg()+' Exporter PGN';host.parentElement.appendChild(b);b.addEventListener('click',function(){var g=kind==='bot'?bot:local;if(!g||!g.history().length){alert('Aucun coup à exporter.');return}var pgn=g.pgn({newline:'\n',max_width:0});var blob=new Blob([pgn+'\n'],{type:'application/x-chess-pgn'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='partie-'+new Date().toISOString().slice(0,10)+'.pgn';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},500)});}
          document.addEventListener('DOMContentLoaded',function(){add('botNew','bot');add('localNew','local');});
          })();</script>'''
          s=s.replace('</head>',inject+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restore visible PGN export buttons' || exit 0
          git push
